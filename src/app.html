<!doctype html>
<html lang="%aico.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// "/" is everyone's address: send the visitor on to their language,
			// the first of the browser's languages (the visitor's own setting,
			// region included) that the site has, matched whole ("de-AT") or by
			// language ("de"), else the site's first. Every other address is a
			// language already and stays as it is: links and search results lead
			// where they say.
			if (location.pathname === "/") {
				const site = %aico.locales%;
				const asked = (navigator.languages?.length ? navigator.languages : [navigator.language]).map((l) => l.toLowerCase());
				const lang = asked.flatMap((l) => [l, l.split("-")[0]]).find((l) => site.includes(l)) ?? site[0];
				location.replace(`/${lang}/${location.search}${location.hash}`);
			}
		</script>
		<script>
			// blueprint's dark theme is a class; follow the system's before first paint
			const dark = matchMedia("(prefers-color-scheme: dark)");
			const apply = () => document.documentElement.classList.toggle("aico-dark", dark.matches);
			apply();
			dark.addEventListener("change", apply);
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
